<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2030 삶책길 교실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1F3A7A;
    --life:#F2776B;   /* 삶 */
    --book:#4DAE5A;   /* 책 */
    --road:#3A8EE0;   /* 길 */
    --ink:#3B2E2A;
    --cream:#FFF9EE;
    --path:#F8E6BE;
    --path-edge:#EFD49A;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    color:var(--ink);
    background:var(--cream);
    -webkit-tap-highlight-color:transparent;
  }
  .page{
    position:relative;
    min-height:100%;
    max-width:480px;
    margin:0 auto;
    overflow:hidden;
    min-height:100dvh;
    background:#A8D68B;
    padding-bottom:48px;
  }

  /* 배경 장면 */
  .scene{position:absolute;inset:0;width:100%;height:100%;z-index:0}
  .cloud{animation:drift 16s ease-in-out infinite alternate}
  .cloud.slow{animation-duration:22s;animation-direction:alternate-reverse}
  @keyframes drift{from{transform:translateX(0)}to{transform:translateX(14px)}}

  /* 타이틀 */
  header{position:relative;z-index:1;text-align:center;padding:104px 20px 0}
  .year{
    display:block;font-size:40px;color:var(--navy);letter-spacing:2px;
    text-shadow:0 2px 0 #fff;
  }
  .title-wrap{position:relative;display:inline-block;margin-top:2px}
  h1{
    font-size:54px;font-weight:400;line-height:1.1;letter-spacing:1px;
    -webkit-text-stroke:7px #fff;paint-order:stroke fill;
    filter:drop-shadow(0 4px 0 rgba(31,58,122,.12));
    animation:pop .7s cubic-bezier(.34,1.56,.64,1) both;
  }
  h1 .l{color:var(--life)} h1 .b{color:var(--book)} h1 .r{color:var(--road)} h1 .n{color:var(--navy)}
  @keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
  .rays{position:absolute;top:50%;width:28px;height:40px;transform:translateY(-50%)}
  .rays.left{left:-36px} .rays.right{right:-36px;transform:translateY(-50%) scaleX(-1)}

  /* 메뉴 */
  .menu{
    position:relative;z-index:1;
    display:grid;grid-template-columns:1fr 1fr;gap:18px 16px;
    padding:clamp(48px, 14vh, 140px) 22px 0;
  }
  .card{
    position:relative;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
    aspect-ratio:1/0.86;
    border:3px solid var(--bd);
    border-radius:30px;
    background:var(--bg);
    box-shadow:0 6px 0 var(--bd);
    font:inherit;font-size:25px;color:var(--ink);
    cursor:pointer;text-decoration:none;
    transform:rotate(var(--tilt));
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .card:active{transform:rotate(var(--tilt)) translateY(5px);box-shadow:0 1px 0 var(--bd)}
  .card:focus-visible{outline:4px solid var(--navy);outline-offset:4px}
  .card svg{width:74px;height:74px}
  .intro {--bg:#FFF3C9;--bd:#F3CE63;--tilt:-1.2deg}
  .plan  {--bg:#E3F5DC;--bd:#8FD08A;--tilt:1deg}
  .join  {--bg:#DCEEFC;--bd:#86BDEB;--tilt:1.2deg}
  .review{--bg:#FDE3E1;--bd:#F3A39B;--tilt:-1deg}

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
  @media (max-width:360px){
    h1{font-size:46px} .card{font-size:22px} .card svg{width:62px;height:62px}
  }
</style>
</head>
