<style>

    box-shadow:0 4px 0 var(--yellow-bd);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .back:active{transform:translateY(3px);box-shadow:0 1px 0 var(--yellow-bd)}
  .back:focus-visible{outline:4px solid var(--navy);outline-offset:4px}
  .back svg{width:24px;height:24px}
  figure{
    background:#fff;border:3px solid #fff;border-radius:24px;overflow:hidden;
    box-shadow:0 6px 0 #E6D7B8, 0 12px 30px rgba(120,90,40,.12);
  }
  figure img{display:block;width:100%;height:auto}
  .hint{text-align:center;margin-top:16px;font-size:15px;color:#8A7A66}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
